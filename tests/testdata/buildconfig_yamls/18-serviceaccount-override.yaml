apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: custom-sa-build
  namespace: buildconfig-demo
  labels:
    app: custom-sa-test
spec:
  serviceAccount: custom-builder-sa
  output:
    to:
      kind: ImageStreamTag
      name: custom-sa-build:latest
    pushSecret:
      name: registry-push-secret
  source:
    type: Git
    git:
      uri: https://github.com/sclorg/nodejs-ex.git
      ref: master
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: nodejs:latest
      pullSecret:
        name: registry-pull-secret
  triggers:
    - type: ConfigChange
